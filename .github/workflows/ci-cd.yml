name: Build, Test and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Runs on every push and pull request. This is the staging check:
  # build, automated tests and a smoke test with a separate staging data folder.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: javac -d out *.java

      - name: Run automated tests
        run: java -cp out LibraryTests

      - name: Build the JAR file
        run: |
          rm out/LibraryTests*.class
          jar cfe library-management-system.jar Main -C out .

      - name: Staging smoke test
        run: |
          printf '2\nSmoke Book\nSmoke Author\n1\n9\n0\n' | LIBRARY_DATA_DIR=staging-data LIBRARY_LOG_DIR=staging-logs java -jar library-management-system.jar | tee smoke.txt
          grep -q "Smoke Book" smoke.txt
          test -f staging-logs/library-0.log
          cat staging-logs/library-0.log

      - name: Save the JAR file
        uses: actions/upload-artifact@v4
        with:
          name: library-management-system-jar
          path: library-management-system.jar

  # Runs only when a version tag such as v1.0.0 is pushed. This is the production release.
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested JAR file
        uses: actions/download-artifact@v4
        with:
          name: library-management-system-jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" library-management-system.jar \
            --repo "${{ github.repository }}" \
            --title "Library Management System ${{ github.ref_name }}" \
            --generate-notes